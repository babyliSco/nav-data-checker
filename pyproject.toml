[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nav-data-checker"
version = "0.1.0"
description = "A small, dependency-free quality checker for navigation CSV data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Li Yan" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
nav-data-checker = "nav_data_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

